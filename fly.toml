app = "agent-artifacts"
primary_region = "iad"

[build]
  dockerfile = "docker/Dockerfile"

[env]
  DEPLOYMENT = "self-hosted"
  PORT = "3000"
  BASE_URL = "https://agent-artifacts.fly.dev"
  AA_SQLITE_PATH = "/data/agent-artifacts.db"
  AA_HIDE_FOOTER = "false"
  AA_RATE_LIMIT_RPM = "60"
  AA_RATE_LIMIT_WRITES_PER_MIN = "10"
  AA_TRUST_PROXY = "1"
  LOG_LEVEL = "info"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[checks]
  [checks.healthz]
    port = 3000
    type = "http"
    interval = "30s"
    timeout = "5s"
    path = "/healthz"
    grace_period = "10s"

[mounts]
  source = "agent_artifacts_data"
  destination = "/data"
  initial_size = "1gb"
  snapshot_retention = 7

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
